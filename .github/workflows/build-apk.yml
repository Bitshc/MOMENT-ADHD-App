
name: Build MOMENT debug APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/traffic-departure-watch]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Check local reminder timing and database migration
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          javac -d /tmp/moment-tests MomentAndroid/app/src/main/java/com/moment/app/ReminderPlan.java tests/ReminderPlanTest.java
          java -cp /tmp/moment-tests com.moment.app.ReminderPlanTest
          javac -d /tmp/moment-tests MomentAndroid/app/src/main/java/com/moment/app/CalendarItem.java MomentAndroid/app/src/main/java/com/moment/app/CalendarMath.java tests/CalendarMathTest.java
          java -cp /tmp/moment-tests com.moment.app.CalendarMathTest

      - name: Build debug APK
        working-directory: MomentAndroid
        run: gradle --no-daemon :app:assembleDebug --stacktrace


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOMENT-debug-apk
          path: MomentAndroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
